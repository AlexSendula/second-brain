<ul class="rules">
<li><strong>The vault is the truth.</strong> Plain markdown. <a class="ref" href="{{ '/system-design/#2-principles' | relative_url }}" aria-label="Principle 2">Principle 2</a></li>
<li><strong>The folder is the parent.</strong> A task, list, appointment or commitment lives in its project or area folder; moving it means moving the file. <a class="ref" href="{{ '/system-design/#52-conventions' | relative_url }}" aria-label="Section 5.2">5.2</a></li>
<li><strong>People and conversations get their own folders.</strong> Both belong to several topics at once. <a class="ref" href="{{ '/system-design/#52-conventions' | relative_url }}" aria-label="Section 5.2">5.2</a></li>
<li><strong>Links are by name:</strong> <code>[[Website for Sam]]</code>. <a class="ref" href="{{ '/system-design/#52-conventions' | relative_url }}" aria-label="Section 5.2">5.2</a></li>
<li><strong>The archive mirrors the vault:</strong> <code>Archive/Projects/&lt;Name&gt;/</code>, <code>Archive/Areas/&lt;Area&gt;/…</code>, so an item always has the same spot, however often it's revived and archived again. <a class="ref" href="{{ '/system-design/#52-conventions' | relative_url }}" aria-label="Section 5.2">5.2</a></li>
</ul>
